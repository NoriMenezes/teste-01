<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUBE DOS CAMINHÕES ARQUEADOS</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      margin: 0;
      text-align: center;
    }

    header {
      background: #ff4500;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 10px;
      width: 300px;
      padding: 10px;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card h3 {
      color: #ff7300;
      margin: 10px 0 5px 0;
    }

    footer {
      background: #1a1a1a;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>CLUBE DOS BRUTOS ARQUEADOS DO BRASIL</h1>
  </header>

  <h2>Nossa Galeria</h2>
  
  <div class="galeria">
    
    <!-- CARD 1 - SÓ TROCAR O src E O alt -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?w=600" alt="Scania Vermelha">
      <h3>Scania Arqueada</h3>
      <p>Os brutos mais insanos da estrada</p>
    </div>

    <!-- CARD 2 - SÓ TROCAR O src E O alt -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1591768793355-74d04bb6608f?w=600" alt="Volvo Branco">
      <h3>Volvo FH</h3>
      <p>Potência e estilo no grau</p>
    </div>

    <!-- CARD 3 - SÓ TROCAR O src E O alt -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1557223562-6c77ef16210f?w=600" alt="Encontro de Caminhões">
      <h3>Eventos</h3>
      <p>Cobertura dos maiores encontros</p>
    </div>

  </div>

  <footer>
    <p>&copy; PATROCÍNIO MOLAS E SUSPENSÃO DUDU</p>
  </footer>

</body>
</html>
