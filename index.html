<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASA DO MOTORES FORD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: linear-gradient(90deg, #4400ff, #00ffcc);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    nav {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
      border-bottom: 2px solid #ff7300;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    nav a:hover {
      color: #ff7300;
      transform: scale(1.1);
    }

    main {
      padding: 40px 20px;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    main h2 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #ff7300;
    }

    main p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #ccc;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 0;
      border: 1px solid #333;
      overflow: hidden;
      transition: 0.3s;
    }
   
    .card:hover {
      transform: translateY(-5px);
      border-color: #ff7300;
      box-shadow: 0 5px 15px rgba(255, 115, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
   
    .card-content {
      padding: 20px;
    }
   
    .card h3 {
      color: #ff7300;
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    footer {
      background: #1a1a1a;
      text-align: center;
      padding: 20px;
      margin-top: 60px;
      border-top: 2px solid #ff7300;
    }
   
    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      nav { gap: 15px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>GARAGEM FORD </h1>
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#fotos">Fotos</a>
    <a href="#videos">Vídeos</a>
    <a href="#contato">Contato</a>
  </nav>

  <main>
    <h2>Bem-vindo FORD</h2>
    <p>SOMENTE FORD.</p>
   
    <div class="galeria">
      <div class="card">
        <img src="https://i.pinimg.com/1200x/c8/f7/7c/c8f77c534bc2621136bcf900f5b86373.jpg" alt="F250 AZUL" width="300">
        <div class="card-content">
          <h3>F250 TUNADA</h3>
          <p>As pick ups mais tops</p>
        </div>
      </div>
      <div class="card">
        <img src="https://www.estadao.com.br/resizer/v2/J3QQYCRVBVLLJM3O2OYFPM7OFM.jpg?quality=80&auth=8b8d67404784d0c3f8b53b4113816aab101a43ef87c52a834051bbf314f97ec9&width=1200" alt="F100 TOP" width="300">
        <div class="card-content">
          <h3>F100 Top</h3>
          <p>Potência e Estilo</p>
        </div>
      </div>
      <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmVABhmiUjWQeGYgmI239wyuzun_8Epanc4ntStPaCifIwOaUrHcKosJA&s=10" alt="Mustang" width="300">
          <h3>Mustang 2026</h3>
          <p>Não há Limites</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; PATROCÍNIO Zebra Acessórios</p>
  </footer>

</body>
</html>
